[package]
name = "mem0-mcp-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "MCP server core for mem0 memory operations"

[dependencies]
pmcp = { path = "/Users/guy/Development/mcp/sdk/rust-mcp-sdk", features = ["streamable-http", "schema-generation", "mcp-apps", "macros"] }
mem0-rust = { path = "..", features = ["s3vectors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
