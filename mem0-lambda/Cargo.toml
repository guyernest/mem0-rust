[package]
name = "mem0-lambda"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AWS Lambda wrapper for the mem0 MCP memory server"

[[bin]]
name = "bootstrap"
# REQUIRED: AWS Lambda Custom Runtime API requires this exact name
# See: https://docs.aws.amazon.com/lambda/latest/dg/runtimes-custom.html
path = "src/main.rs"

[dependencies]
mem0-mcp-core = { path = "../mem0-mcp-core" }
mem0-rust = { path = "..", features = ["openai", "s3vectors", "anthropic"] }
pmcp = { path = "/Users/guy/Development/mcp/sdk/rust-mcp-sdk", features = ["streamable-http", "schema-generation", "mcp-apps", "macros"] }

# Lambda runtime
lambda_http = "0.13"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
once_cell = "1.19"
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
